openapi: 3.1.0
info:
  title: TrailCheck API
  version: "2026-11-27"
  description: |
    TrailCheck's API shows you exactly where agents get stuck completing your API workflows, and gives your coding agent the fixes.
    The check is made up of 3 calls: review: reads your resources like an integrator, then build validation: builds real use cases and returns one report with the review's findings and its own, then fix: writes the fix file from that report. Combine is an optional call intended for more complex flows.
    Note: At the moment, the cold build is a paper build only: the agent works through the use cases from your resources. It doesn't run code or send authenticated requests to your API.
    A failure on one call does not affect the outputs from earlier calls.
    
    This file is the machine-readable contract for caller methods
    (health, four starts, GET the job list, GET job info and files).
    Keep the `jobId` from the 202. The job list (`GET /jobs`) is how to find that id again.
    Jobs and their files stay on the host for 3 months.

    Other resources:
    Machine-readable flows: `arazzo.yaml`. 
    Agent how-to: `SKILL.md`. 

    Authentication:
    Authenticate with `Authorization: Bearer` plus an API key, and `aiModel` on the start body
    (`primaryName` required). AI model key in `aiModel.key` or `x-model-key`. 
    Purchase an API key at https://trailcheck.dev/.
    Provide your own AI model key.

    Supported AI model keys: Anthropic, OpenAI, DeepSeek, xAI, Mistral, Groq, and Google. 
    Tested with Anthropic keys. OpenAI, Groq, DeepSeek, xAI, Mistral, and Google keys are accepted but untested, and a long report or fix file may fail with them.
    A ChatGPT login is not a key. A Cursor key cannot run this loop.
    If you omit `aiModel.company` the host guesses from the key.

    Each accepted start counts as one call: review, validation, fix file, or combine, including a rerun and a start again from a failed job. The count is decremented immediately when a call is accepted, but if the job ends with no report/fix file, you aren't charged a call for that run. Each successful report or fix file generation costs one call. Each call is one third of the review + cold build + fix file as sold in the app (1 review + cold build + fix file = 1 review call, 1 build validation call, and 1 fix file call). However the customer can use the 15 available calls in any ratio. A top-up adds 3 calls and does not change how many have been used or the paid-through date. Two starts don't use a call: a Fix job that continues a `Partial` one, and the first `/combine` that names a Validation whose merge didn't finish (see `mergeNote`). The server refuses the start when there are no calls left, or the paid-through date has passed. When the server accepts the start, `remainingCalls` in the 202 says how many calls are still available. It's left out when the start didn't use a call. When the server refuses the start, the status is 402, and the response has `remainingCalls` when the server knows that number. Calls to fetch a finished job do not count toward the call quota.
servers:
  - url: https://agent-server-production-a722.up.railway.app
    description: Live host
tags:
  - name: Health
  - name: Starts
  - name: Jobs
security:
  - AccessApiKey: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /review:
    post:
      tags: [Starts]
      summary: Start a Review
      operationId: postReview
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOrValidationStart"
            examples:
              customer:
                summary: Customer, resources
                value:
                  title: example API
                  resources:
                    - https://example.com/docs
                  useCases:
                    specified:
                      - list things
                  aiModel:
                    primaryName: claude-sonnet-5-5
              priorReport:
                summary: Run again from a prior Review
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /validation:
    post:
      tags: [Starts]
      summary: Start a Validation
      description: |
        Builds on a Review job, or runs an earlier Validation job again, when `priorReport` names it. When a Review job ID is specified in `priorReport.jobId`, it returns the combined report: the Review's findings and the Validation's, in one report. When no `title` is specified and a Review job ID is specified, this call pulls the title from the Review. The specified job must have `report.md`, or be a failed Validation to start again. Without `priorReport`: send `resources`. The Validation job finds its own use cases.
        Note: At the moment, the cold build is a paper build only: the agent works through the use cases from your resources. It doesn't run code or send authenticated requests to your API.
      operationId: postValidation
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOrValidationStart"
            examples:
              fromReview:
                summary: Validate a Review
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  aiModel:
                    primaryName: claude-sonnet-5-5
              someUseCases:
                summary: Check 2 of the Review's use cases
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  useCases:
                    max: 2
                    ids: [uc-1, uc-2]
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /combine:
    post:
      tags: [Starts]
      summary: Start a Combined report
      description: Joins the reports of two or more jobs into one combined report. It's an optional call intended for more complex flows, for example when use cases for the same resources were split into two Reviews, or into two Validations from one Review. Needs one or more Review jobs, plus any Validation jobs, each with `report.md`. If a Validation's report already includes the Review's findings, they aren't counted twice.
      operationId: postCombined
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombinedStart"
            examples:
              twoJobs:
                value:
                  priorReport:
                    jobIds:
                      - "00000000-0000-0000-0000-000000000001"
                      - "00000000-0000-0000-0000-000000000002"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /fix:
    post:
      tags: [Starts]
      summary: Start a Fix job
      description: |
        Writes a fix file from the report of the job named in `priorReport.jobId`: a Review, Validation or Combined job. It takes only `priorReport`, `aiModel` and `notifyEmail`. Its `title` is the title of that job, and with no `notifyEmail` it uses the prior report job's address. To finish a `Partial` fix file, name the Partial Fix job: the new one generates the rest, without using a call. Naming a Failed or Completed Fix job writes a new fix file from the same report, and uses a call. The fix file is at `GET /jobs/{jobId}/fix`, with the new job's ID.
      operationId: postFix
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FixStart"
            examples:
              fromReport:
                summary: A fix file from a report
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
          description: "`jobId missing - send priorReport.jobId of the report the fix file will be based on`, or `this job failed, so it has no report to write a fix file from`."
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: the named job is still running. `the fix file is already being written`: a Fix job for that report is running."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        The jobs this API key started, newest first. Each entry has id, type, title, status, startedAt, finishedAt and score.
        The rest of a job's details are at GET /jobs/{jobId}/info. The report file is at GET /jobs/{jobId}/report, the fix file is at GET /jobs/{jobId}/fix, and the path file is at GET /jobs/{jobId}/path.
        An empty array means this API key has no jobs, or none match the filters.
      operationId: listJobs
      security:
        - AccessApiKey: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [Review, Validation, Combined, Fix]
        - name: status
          in: query
          required: false
          description: Partial is only for a Fix job whose fix file stops partway.
          schema:
            type: string
            enum: [In progress, Completed, Failed, Partial]
        - name: limit
          in: query
          required: false
          description: The newest N jobs.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Jobs this API key started. Empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListEntry"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"

  /balance:
    get:
      tags: [Jobs]
      summary: Calls left on your plan
      description: How many calls this API key has left, how many it has used, how many the plan includes, and the paid-through date. Checking doesn't use a call.
      operationId: getBalance
      security:
        - AccessApiKey: []
      responses:
        "200":
          description: The key's plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/ErrorJson"

  /jobs/{jobId}/info:
    get:
      tags: [Jobs]
      summary: Job info
      description: Poll once a minute until status is Completed, Partial or Failed. There is no rate limit.
      operationId: getJobInfo
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobInfo"
              examples:
                completed:
                  summary: Completed Review
                  value:
                    id: "00000000-0000-0000-0000-000000000000"
                    status: Completed
                    type: Review
                    title: example API
                    startedAt: "2026-09-15T12:00:00.000Z"
                    finishedAt: "2026-09-15T12:20:00.000Z"
                    score: 76
                    scoreStatus: "The report says score: 70, but counting the findings adds up to 76."
                    summary: what we found
                failed:
                  summary: Failed
                  value:
                    id: "00000000-0000-0000-0000-000000000000"
                    status: Failed
                    type: Review
                    title: example API
                    startedAt: "2026-09-15T12:00:00.000Z"
                    finishedAt: "2026-09-15T12:05:00.000Z"
                    failureDetails: "The report was cut off at the 128,000-token reply limit for claude-sonnet-5-5 before it was handed in. You weren't charged a call for this run. To get a report, start 2 smaller reviews, each with this job ID as priorReport and 2 use cases in useCases.max. You can specify the specific use cases in useCases.specified to prevent overlap and make sure all are tested. Then call Combine with both reviews. Or try again with fewer resources. The largest pages this job read: https://example.com/openapi.json (1,124 KB, sent); https://example.com/docs/auth (360 KB, sent); https://example.com/docs/guide (99 KB, opened by following a link)."
                    failureCode: reply_limit
                mergedValidation:
                  summary: Validation that includes the Review's findings
                  value:
                    id: "00000000-0000-0000-0000-000000000002"
                    status: Completed
                    type: Validation
                    title: example API
                    startedAt: "2026-09-15T12:30:00.000Z"
                    finishedAt: "2026-09-15T12:50:00.000Z"
                    score: 78
                    scoreMax: 92
                    priorReportJobIds: ["00000000-0000-0000-0000-000000000000"]
                    includesReviewFindings: true
                    fixJobIds: ["00000000-0000-0000-0000-000000000003"]
                partialFix:
                  summary: Partial Fix job
                  value:
                    id: "00000000-0000-0000-0000-000000000003"
                    status: Partial
                    type: Fix
                    title: example API
                    startedAt: "2026-09-15T13:00:00.000Z"
                    finishedAt: "2026-09-15T13:10:00.000Z"
                    priorReportJobIds: ["00000000-0000-0000-0000-000000000002"]
                    partialFixDetails:
                      note: The fix file was only partially generated. It stops before task #7.
                      stopsBeforeTask: 7
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          $ref: "#/components/responses/ErrorJson"

  /jobs/{jobId}/report:
    get:
      tags: [Jobs]
      summary: Report markdown
      operationId: getJobReport
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Report exists
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `this job failed, no report available`; `Fix job ID passed for a report. The report is on job <Job ID>.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /jobs/{jobId}/fix:
    get:
      tags: [Jobs]
      summary: Fix file markdown
      operationId: getJobFix
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: "A fix file has been generated successfully. If this Fix job's status is `Partial`, the file stops partway. See the beginning of the file for where it stops and how to generate the rest."
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `this job failed, no fix file available`; on a Review, Validation or Combined job: `Review job ID passed for a fix file. The fix file is on Fix job <Job ID>.`, naming the latest Fix job made from it; `Review job ID passed for a fix file. No fix file was made from this job yet: call POST /fix.` when none was made; `Review job ID passed for a fix file. This job failed, so no fix file can be made from it.` when that job failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /jobs/{jobId}/path:
    get:
      tags: [Jobs]
      summary: Path file markdown (Validation)
      operationId: getJobPath
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Path file exists
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `only Validation jobs have a path file`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /jobs/{jobId}/calls.json:
    get:
      tags: [Jobs]
      summary: Page GETs and model rounds
      operationId: getJobCalls
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Call list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: the call list is written when the job ends"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    AccessApiKey:
      type: http
      scheme: bearer
      description: API key. Purchase an API key at https://trailcheck.dev/.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XModelKey:
      name: x-model-key
      in: header
      required: false
      description: Customer AI model key if not in `aiModel.key`. If both are sent and differ → 400.
      schema:
        type: string
  responses:
    AcceptedJob:
      description: Job started
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Accepted"
          examples:
            started:
              value:
                jobId: "00000000-0000-0000-0000-000000000000"
                remainingCalls: 14
    CallsRefused:
      description: The API key has no calls left, the paid-through date has passed, or the balance is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            usedUp:
              value:
                error: no calls left
                remainingCalls: 0
            paidThrough:
              value:
                error: the paid-through date has passed
                remainingCalls: 4
            missing:
              value:
                error: no balance
    ErrorJson:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            unauthorized:
              value:
                error: unauthorized
            missingResourceOrPrior:
              value:
                error: at least one resource or prior report is required
  schemas:
    Health:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorBody:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable string. No `code` or `details` field.
        remainingCalls:
          type: integer
          description: Calls remaining. Present on a 402 when the server knows the number.
      examples:
        - error: unauthorized
        - error: at least one resource or prior report is required
        - error: primaryName is required
        - error: an ai model key is required
        - error: a Cursor key cannot run this loop
        - error: could not tell which company this key is for
        - error: two different ai models were sent - resend with one model.
        - error: send priorReport.jobIds with one or more Review jobs, plus any Validation jobs
        - error: "Review job 00000000-0000-0000-0000-000000000000 failed, so it has no report to build on. To start it again, send POST /review with this job ID as priorReport, then start the validation from the new review."
        - error: "Anthropic doesn't have the model claude-sonet-5-5. It may be retired or misspelled. Send a current model name in aiModel.primaryName (and cheapName)."
        - error: not found
        - error: "unknown field: usecases"
        - error: resources must be a string or list of strings
        - error: useCases.max must be a whole number from 1 to 4
        - error: useCases.ids must be a list of use case IDs
        - error: when specifying useCases.ids, priorReport.jobId must also be passed
        - error: use case uc-9 couldn't be found in job 00000000-0000-0000-0000-000000000000
        - error: 3 use cases specified in useCases.ids and useCases.specified but useCases.max is 2
        - error: this job failed, no report available
        - error: Fix job ID passed for a report. The report is on job 00000000-0000-0000-0000-000000000000.
        - error: this job failed, no fix file available
        - error: Review job ID passed for a fix file. The fix file is on Fix job 00000000-0000-0000-0000-000000000000.
        - error: "Review job ID passed for a fix file. No fix file was made from this job yet: call POST /fix."
        - error: Review job ID passed for a fix file. This job failed, so no fix file can be made from it.
        - error: only Validation jobs have a path file
        - error: jobId missing - send priorReport.jobId of the report the fix file will be based on
        - error: this job failed, so it has no report to write a fix file from
        - error: job is in progress
        - error: the fix file is already being written
        - error: no calls left
          remainingCalls: 0
        - error: the paid-through date has passed
        - error: no balance
        - error: status must be In progress, Completed, Failed or Partial
        - error: type must be Review, Validation, Combined or Fix
    Accepted:
      type: object
      required: [jobId]
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        remainingCalls:
          type: integer
          description: Calls remaining after this start. API key starts only.
    AiModel:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          description: Their AI model key if not in `x-model-key`.
        primaryName:
          type: string
          description: Required on a customer start.
        cheapName:
          type: string
          description: Omit and `primaryName` is used for every pass.
        company:
          type: string
          description: anthropic / claude, openai / chatgpt / gpt, deepseek, xai / grok, mistral, groq, google / gemini. Omit and the host guesses from the key.
    UseCases:
      description: 'Which use cases to check. Send an object with `specified`, `max` and `ids`, or just a list of titles: `["Send a payment"]` is short for `{ "specified": ["Send a payment"] }`.'
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            specified:
              type: array
              items:
                type: string
              description: Use cases by title. Up to 4. If you send more, only the first 4 are used.
            max:
              type: integer
              minimum: 1
              maximum: 4
              default: 4
              description: How many use cases to check in all, 1 to 4. With less than 4 `ids` and no `max`, only the specified IDs are checked.
            ids:
              type: array
              items:
                type: string
              description: Use case IDs (uc-1, uc-2…) from the useCaseRecords of the job in priorReport.jobId. Needs priorReport.jobId. The ones named in ids and specified are checked first, and the rest are chosen up to max. Naming more than max is refused.
        - type: array
          items:
            type: string
    CombinedPriorReport:
      type: object
      additionalProperties: false
      required: [jobIds]
      properties:
        jobIds:
          description: The jobs to combine, a list of IDs or a comma-separated string. One or more Review jobs, plus any Validation jobs.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    PriorReport:
      type: object
      additionalProperties: false
      properties:
        jobId:
          description: One ID, a list of IDs, or a comma-separated string.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    ReviewOrValidationStart:
      type: object
      additionalProperties: false
      description: At least one of `resources` or `priorReport` is required.
      properties:
        resources:
          description: URL strings, or a single string. Only the hosts in these URLs are read, plus hosts that an llms.txt here links to.
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        title:
          type: string
          default: ""
        useCases:
          $ref: "#/components/schemas/UseCases"
        stage:
          type: string
          enum: [Design, Publish]
          description: Not implemented yet.
        aiModel:
          $ref: "#/components/schemas/AiModel"
        notifyEmail:
          type: string
          format: email
          description: >-
            One address. When the job ends Completed or Failed, TrailCheck sends one email
            there from info@trailcheck.dev, saying how to get the report, and what you can start next. Nothing
            is attached. Not an address is an error (400 `notifyEmail must be an email address`). A start again from a failed job without
            `notifyEmail` uses the failed job's address.
        priorReport:
          $ref: "#/components/schemas/PriorReport"
        guidelines:
          type: string
          description: >
            Review only. Markdown of their API style guide. The review checks the API
            against this file and against the checklist. Omit when they have none.
            A run-again that omits it uses the guidelines from the prior Review when
            that job had them. A string on this start is the file for this job.
            Not a string, or sent on Validation, is an error. Combined rejects this field the same way.
    FixStart:
      type: object
      additionalProperties: false
      required: [priorReport, aiModel]
      description: "`priorReport.jobId` names one Review, Validation, Combined or Fix job. `aiModel` is required (`primaryName` required), the same as any start."
      properties:
        priorReport:
          $ref: "#/components/schemas/PriorReport"
        aiModel:
          $ref: "#/components/schemas/AiModel"
        notifyEmail:
          type: string
          format: email
          description: >-
            One address. When the job ends Completed, Partial or Failed, TrailCheck sends one email
            there from info@trailcheck.dev, saying how to get the fix file. Nothing is attached.
            Not an address is an error (400 `notifyEmail must be an email address`). Omit it to use
            the prior report job's address.
    CombinedStart:
      type: object
      additionalProperties: false
      required: [priorReport]
      description: One or more Review jobs, plus any Validation jobs, each with `report.md`.
      properties:
        priorReport:
          $ref: "#/components/schemas/CombinedPriorReport"
        title:
          type: string
          default: ""
        aiModel:
          $ref: "#/components/schemas/AiModel"
        notifyEmail:
          type: string
          format: email
          description: >-
            One address. When the job ends Completed or Failed, TrailCheck sends one email
            there from info@trailcheck.dev, saying how to get the report, and what you can start next. Nothing
            is attached. Not an address is an error (400 `notifyEmail must be an email address`). A start again from a failed job without
            `notifyEmail` uses the failed job's address.
    JobListEntry:
      type: object
      required: [id, type, title, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [Review, Validation, Combined, Fix]
        title:
          type: string
        status:
          type: string
          enum: [In progress, Completed, Failed, Partial]
          description: Partial is only for a Fix job whose fix file stops partway.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        score:
          type: number
    Balance:
      type: object
      required: [remainingCalls, used, included]
      properties:
        remainingCalls:
          type: integer
        used:
          type: integer
        included:
          type: integer
        paidThrough:
          type: string
          format: date-time
          description: Left out when the key has no plan. Then every number is 0.
    JobInfo:
      type: object
      required: [id, status, type, title, startedAt]
      properties:
        callUsed:
          type: boolean
          description: true if this job used a call from the plan; false when the job ended with no report/fix file and the call was given back, or when the start didn't use a call.
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [In progress, Completed, Failed, Partial]
          description: Partial is only for a Fix job whose fix file stops partway.
        type:
          type: string
          enum: [Review, Validation, Combined, Fix]
        title:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: When status is Completed or Failed.
        failureDetails:
          type: string
          description: >-
            When status is Failed. A string: what happened, then what to do next. AI-side errors say
            whose key and end with the company's request ID. A start with no report ends with
            `You weren't charged a call for this run.`
        failureCode:
          type: string
          description: When status is Failed. The reason as a code. On a Fix job it can also be refused (the fix file check refused a line) or not_handed_in (the AI didn't hand in a fix file).
          enum: [reply_limit, input_limit, no_report, key_refused, no_credit, rate_limited, model_not_found, request_rejected, ai_unavailable, connection_lost, method_unavailable, server_restarted, findings_unreadable, internal_error, refused, not_handed_in]
        score:
          type: number
          description: When parsed. If scoreStatus is present, this is the second number in that string.
        scoreMax:
          type: number
          description: With score. What the score is out of. 100 for a Review. Lower on a Validation or Combined report when use cases or checks didn't run.
        scoreStatus:
          type: string
          description: "Present in two cases. When the score in the report did not match a count based on the findings, it names both numbers, and `score` is then the second number. When the server couldn't read the report's findings, it's `The server couldn't read the report's findings, so the score wasn't confirmed.` The job is still Completed, and `score` is the number the report gives, when it gives one."
        summary:
          type: string
        primaryName:
          type: string
          description: Model name for this job. The API key and the AI model key are not returned.
        priorReportJobIds:
          type: array
          items:
            type: string
          description: The earlier reports this job was made from. On a Validation from a Review, the Review. On a Combined job, every job it joined. On a rerun, the job it reran. On a Fix job, the report its fix file was made from. Omitted when this job didn't start from one.
        useCaseRecords:
          type: array
          description: "Each use case read from the report. Omitted until the report is saved, and when the use cases cannot be read from the report (see useCaseScoresNote). Each use case's score counts only the findings that affect it. The overall score counts every finding, so it can be lower than every use case's score. Each entry has an id: uc-1, uc-2, and so on. A job started from an earlier job keeps that job's IDs for the same use cases. Numbers can skip: a use case keeps its ID from job to job, and a new one gets the next unused number. Send them in useCases.ids to choose which use cases a new job checks."
          items:
            type: object
            required: [id, title, goal, steps, provided, findingNumbers, score]
            properties:
              id:
                type: string
              title:
                type: string
              goal:
                type: string
              steps:
                type: string
              note:
                type: string
              provided:
                type: boolean
                description: True when this title matches a use case they named on the start, after lowercasing and collapsing spaces.
              findingNumbers:
                type: array
                items:
                  type: number
              score:
                type: number
              completionStatus:
                type: string
                enum: [Completed, Partial, Not completed]
                description: Present when the report gives one.
              outcome:
                type: string
                description: Present when the report gives one.
        useCasesNote:
          type: string
          description: Present when the use cases section had text that isn't in useCaseRecords. Always `The use cases section had extra text that isn't in this list. Read it in the report.`
        useCaseScoresNote:
          type: string
          description: >-
            Present when the use cases couldn't be read from the report, so there are no useCaseRecords.
            The job is still Completed: the report and score are not affected. Always
            `The per-use-case scores couldn't be read. The use cases are in the report.`
        notifyEmail:
          type: string
          description: The address sent on the start, when one was sent. The email went there when the job ended.
        partialFixDetails:
          type: object
          description: On a Partial Fix job, where its fix file stops.
          properties:
            note:
              type: string
              example: "The fix file was only partially generated. It stops before task #7."
            stopsBeforeTask:
              type: integer
              example: 7
        includesReviewFindings:
          type: boolean
          description: true when a Validation's report already includes the Review's findings. You don't need to call /combine. Present only when true.
        mergeNote:
          type: string
          description: "Returned when the Validation's report doesn't include the Review's findings. To get them in one report, call /combine with the Validation and the Review. The first /combine after this is free. Always `Review and Validation steps both completed successfully, but the reports didn't merge as expected. To get the combined report, call POST /combine with both job IDs. It's free this time.`"
        fixJobIds:
          type: array
          items:
            type: string
          description: The fix files made from this report, oldest first. Get the newest with GET /jobs/<last ID>/fix.
        continuedFromJobId:
          type: string
          description: This job picks up from an earlier one. It finishes a partial fix file, or retries a job that failed.
    CallList:
      type: array
      items:
        oneOf:
          - $ref: "#/components/schemas/CallFetch"
          - $ref: "#/components/schemas/CallModel"
    CallFetch:
      type: object
      required: [kind, at, method, url, status, bytes, contentType]
      properties:
        kind:
          type: string
          enum: [fetch]
        at:
          type: string
          format: date-time
        method:
          type: string
        url:
          type: string
        status:
          description: Number, or null if blocked
          oneOf:
            - type: integer
            - type: "null"
        bytes:
          type: integer
        contentType:
          type: string
        error:
          type: string
    CallModel:
      type: object
      required: [kind, at, model, tokensIn, tokensOut, tools]
      properties:
        kind:
          type: string
          enum: [model]
        at:
          type: string
          format: date-time
        model:
          type: string
        tokensIn:
          type: integer
        tokensOut:
          type: integer
        tools:
          type: array
          items:
            type: string
