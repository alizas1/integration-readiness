openapi: 3.1.0
info:
  title: TrailCheck API
  version: "2026-10-14"
  description: |
    TrailCheck's APIs show you exactly where agents gets stuck completing your API workflows, and gives your coding agent the fixes.
    The check is made up of 3 calls: review: reads your resources like an integrator, then build validation: builds real use cases, then combine: combines the findings from the earlier steps into one report.
    Note: At the moment, the cold build is a paper build only: the agent works through the use cases from your resources. It doesn't run code or send authenticated requests to your API.
    A failure on one call does not affect the outputs from earlier calls.
    
    This file is the machine-readable contract for caller methods
    (health, three starts, GET the job list, GET job info and files, and Generate Fix File (POST to write the fix file on a job that already has a report)).
    Keep the `jobId` from the 202. The job list (`GET /jobs`) is how to find that id again.
    Jobs and their files stay on the host for 3 months.

    Other resources:
    Machine-readable flows: `arazzo.yaml`. 
    Agent how-to: `SKILL.md`. 

    Authentication:
    Authenticate with `Authorization: Bearer` plus an API key, and `aiModel` on the start body
    (`primaryName` required). AI model key in `aiModel.key` or `x-model-key`. 
    Purchase an API key at https://trailcheck.dev/.
    Provide your own AI model key.

    Supported AI model keys: Anthropic, OpenAI, DeepSeek, xAI, Mistral, Groq, and Google. 
    Tested with Anthropic keys. OpenAI, Groq, DeepSeek, xAI, Mistral, and Google keys are accepted but untested, and a long report or fix file may fail with them.
    A ChatGPT login is not a key. A Cursor key cannot run this loop.
    If you omit `aiModel.company` the host guesses from the key.

    Each accepted start counts as one call: review, validation, or combine, including a rerun. The count is decremented immediately when a call is accepted, but if the job ends with no report, the count returns to the original number. 
    A saved report counts as one call. 
    Each call is one third of the review + cold build as sold in the app (1 review + cold build = 1 review call, 1 build validation call, and 1 combine call). 
    However the customer can use the 15 available calls in any ratio. A top-up adds 3 calls and does not change how many have been used or the paid-through date. 
    The server refuses the start when there are no calls left, or the paid-through date has passed. When the server accepts the start, the response says how many calls are still available. 
    When the server refuses the start, the status is 402, and the response says how many calls are still available when it knows that number. 
    Calls to fetch a finished job and write a fix file do not count toward the call quota.
servers:
  - url: https://agent-server-production-a722.up.railway.app
    description: Live host
tags:
  - name: Health
  - name: Starts
  - name: Jobs
security:
  - AccessApiKey: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /review:
    post:
      tags: [Starts]
      summary: Start a Review
      operationId: postReview
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOrValidationStart"
            examples:
              customer:
                summary: Customer, resources
                value:
                  title: example API
                  resources:
                    - https://example.com/docs
                  useCases:
                    specified:
                      - list things
                  aiModel:
                    primaryName: claude-sonnet-5-5
              priorReport:
                summary: Run again from a prior Review
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /validation:
    post:
      tags: [Starts]
      summary: Start a Validation
      description: |
        Builds on a Review job, or runs an earlier Validation job again, when `priorReport` names it. That job must have `report.md`. Without `priorReport`: send `resources`. The Validation job finds its own use cases.
        Note: At the moment, the cold build is a paper build only: the agent works through the use cases from your resources. It doesn't run code or send authenticated requests to your API.
      operationId: postValidation
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOrValidationStart"
            examples:
              fromReview:
                summary: Validate a Review
                value:
                  priorReport:
                    jobId: "00000000-0000-0000-0000-000000000000"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /combine:
    post:
      tags: [Starts]
      summary: Start a Combined report
      description: Needs one or more Review jobs, plus any Validation jobs, each with `report.md`.
      operationId: postCombined
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombinedStart"
            examples:
              twoJobs:
                value:
                  priorReport:
                    jobId:
                      - "00000000-0000-0000-0000-000000000001"
                      - "00000000-0000-0000-0000-000000000002"
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "402":
          $ref: "#/components/responses/CallsRefused"
        "404":
          $ref: "#/components/responses/ErrorJson"
          description: "`not found`: `priorReport` names a job that doesn't exist."
        "409":
          $ref: "#/components/responses/ErrorJson"
          description: "`job is in progress`: `priorReport` names a job that is still running. Wait and send it again."
        "503":
          $ref: "#/components/responses/ErrorJson"

  /jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        Jobs this API key started, newest startedAt first.
        Each item is the same object as get job info. The report, fix file, path file, and call list are not included.
        No filters and no paging. An empty array means this API key has no jobs.
      operationId: listJobs
      security:
        - AccessApiKey: []
      responses:
        "200":
          description: Jobs this API key started. Empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobInfo"
        "401":
          $ref: "#/components/responses/ErrorJson"

  /jobs/{jobId}/info:
    get:
      tags: [Jobs]
      summary: Job info
      description: Poll once a minute until status is Completed or Failed. There is no rate limit.
      operationId: getJobInfo
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobInfo"
              examples:
                completed:
                  summary: Completed Review
                  value:
                    id: "00000000-0000-0000-0000-000000000000"
                    status: Completed
                    type: Review
                    title: example API
                    startedAt: "2026-09-15T12:00:00.000Z"
                    finishedAt: "2026-09-15T12:20:00.000Z"
                    score: 76
                    scoreStatus: "The report says score: 70, but counting the findings adds up to 76."
                    summary: what we found
                failed:
                  summary: Failed
                  value:
                    id: "00000000-0000-0000-0000-000000000000"
                    status: Failed
                    type: Review
                    title: example API
                    startedAt: "2026-09-15T12:00:00.000Z"
                    finishedAt: "2026-09-15T12:05:00.000Z"
                    failureDetails: "The report was cut off at the 128,000-token reply limit for claude-sonnet-5-5 before it was handed in. The AI's thinking counts toward that limit. To get a report, start a new job with fewer use cases or fewer pages, or split the use cases across two jobs. Then call Combine with both jobs, plus any Validations. The largest pages this job read: https://example.com/openapi.json (1,124 KB, sent); https://example.com/docs/auth (360 KB, sent); https://example.com/docs/guide (99 KB, opened by following a link). You weren't charged a call for this run."
                    failureCode: reply_limit
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          $ref: "#/components/responses/ErrorJson"

  /jobs/{jobId}/report:
    get:
      tags: [Jobs]
      summary: Report markdown
      operationId: getJobReport
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Report exists
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `this job failed, so it has no report`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /jobs/{jobId}/fix:
    get:
      tags: [Jobs]
      summary: Fix file markdown
      operationId: getJobFix
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Fix file exists
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `no fix file: see fixFileStatus in the job info` when the job finished with no fix file. GET does not write the file."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`, or `the fix file is being written`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [Jobs]
      summary: Generate Fix File
      description: |
        The job must already have `report.md`. Writes `fix.md` on this same job.
        202 `{ "jobId" }` is that same ID. The job's status does not change: while the fix file is written, `fixFileStatus` is `writing the fix file`. GET info until it is no longer that, then GET the fix file.
        If `fix.md` is already there, this run overwrites it.
        Job In progress → `{ "error": "job is in progress" }` (409).
        A fix file already being written → `{ "error": "the fix file is already being written" }` (409).
        A failed job → `{ "error": "this job failed, so it has no report to write a fix file from" }` (400).
        Customer body needs `aiModel` (`primaryName` required) the same as a start.
        `.md` on the path still works.
      operationId: generateFixFile
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XModelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFixStart"
            examples:
              customer:
                summary: Same authenticate as a start.
                value:
                  aiModel:
                    primaryName: claude-sonnet-5-5
      responses:
        "202":
          $ref: "#/components/responses/AcceptedJob"
        "400":
          $ref: "#/components/responses/ErrorJson"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          $ref: "#/components/responses/ErrorJson"
        "409":
          $ref: "#/components/responses/ErrorJson"
        "503":
          $ref: "#/components/responses/ErrorJson"

  /jobs/{jobId}/path:
    get:
      tags: [Jobs]
      summary: Path file markdown (Validation)
      operationId: getJobPath
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Path file exists
          content:
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown; `only Validation jobs have a path file`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: wait and ask again"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /jobs/{jobId}/calls.json:
    get:
      tags: [Jobs]
      summary: Page GETs and model rounds
      operationId: getJobCalls
      security:
        - AccessApiKey: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Call list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"
        "401":
          $ref: "#/components/responses/ErrorJson"
        "404":
          description: "`not found` if the ID is unknown"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: "`job is in progress`: the call list is written when the job ends"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    AccessApiKey:
      type: http
      scheme: bearer
      description: API key. Purchase an API key at https://trailcheck.dev/.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XModelKey:
      name: x-model-key
      in: header
      required: false
      description: Customer AI model key if not in `aiModel.key`. If both are sent and differ → 400.
      schema:
        type: string
  responses:
    AcceptedJob:
      description: Job started
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Accepted"
          examples:
            started:
              value:
                jobId: "00000000-0000-0000-0000-000000000000"
                remainingCalls: 14
    CallsRefused:
      description: The API key has no calls left, the paid-through date has passed, or the balance is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            usedUp:
              value:
                error: no calls left
                remainingCalls: 0
            paidThrough:
              value:
                error: the paid-through date has passed
                remainingCalls: 4
            missing:
              value:
                error: no balance
    ErrorJson:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            unauthorized:
              value:
                error: unauthorized
            missingResourceOrPrior:
              value:
                error: at least one resource or prior report is required
  schemas:
    Health:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorBody:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable string. No `code` or `details` field.
        remainingCalls:
          type: integer
          description: Calls remaining. Present on a 402 when the server knows the number.
      examples:
        - error: unauthorized
        - error: at least one resource or prior report is required
        - error: primaryName is required
        - error: an ai model key is required
        - error: a Cursor key cannot run this loop
        - error: could not tell which company this key is for
        - error: two different ai models were sent - resend with one model.
        - error: send priorReport.jobId with one or more Review jobs, plus any Validation jobs
        - error: "job 00000000-0000-0000-0000-000000000000 failed, so it has no report and can't be run again. Send the same `POST /review` request again, with its resources."
        - error: job 00000000-0000-0000-0000-000000000000 failed, so it has no report to build on. Run that job again first.
        - error: "Anthropic doesn't have the model claude-sonet-5-5. It may be retired or misspelled. Send a current model name in aiModel.primaryName (and cheapName)."
        - error: not found
        - error: "unknown field: usecases"
        - error: resources must be a string or list of strings
        - error: this job failed, so it has no report
        - error: "no fix file: see fixFileStatus in the job info"
        - error: only Validation jobs have a path file
        - error: this job failed, so it has no report to write a fix file from
        - error: job is in progress
        - error: the fix file is already being written
        - error: no calls left
          remainingCalls: 0
        - error: the paid-through date has passed
        - error: no balance
    Accepted:
      type: object
      required: [jobId]
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        remainingCalls:
          type: integer
          description: Calls remaining after this start. API key starts only.
    AiModel:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          description: Their AI model key if not in `x-model-key`.
        primaryName:
          type: string
          description: Required on a customer start.
        cheapName:
          type: string
          description: Omit and `primaryName` is used for every pass.
        company:
          type: string
          description: anthropic / claude, openai / chatgpt / gpt, deepseek, xai / grok, mistral, groq, google / gemini. Omit and the host guesses from the key.
    UseCases:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            specified:
              type: array
              items:
                type: string
        - type: array
          items:
            type: string
    PriorReport:
      type: object
      additionalProperties: false
      properties:
        jobId:
          description: One ID, a list of IDs, or a comma-separated string.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    ReviewOrValidationStart:
      type: object
      additionalProperties: false
      description: At least one of `resources` or `priorReport` is required.
      properties:
        resources:
          description: URL strings, or a single string. Only the hosts in these URLs are read, plus hosts that an llms.txt here links to.
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        title:
          type: string
          default: ""
        useCases:
          $ref: "#/components/schemas/UseCases"
        stage:
          type: string
          enum: [Design, Publish]
          description: Not implemented yet.
        aiModel:
          $ref: "#/components/schemas/AiModel"
        notifyEmail:
          type: string
          format: email
          description: >-
            One address. When the job ends Completed or Failed, TrailCheck sends one email
            there from info@trailcheck.dev, saying how to get the report and fix file. Nothing
            is attached. Not an address is an error (400 `notifyEmail must be an email address`).
        priorReport:
          $ref: "#/components/schemas/PriorReport"
        guidelines:
          type: string
          description: >
            Review only. Markdown of their API conventions. The review checks the API
            against this file and against the checklist. Omit when they have none.
            A run-again that omits it uses the guidelines from the prior Review when
            that job had them. A string on this start is the file for this job.
            Not a string, or sent on Validation, is an error. Combined rejects this field the same way.
    GenerateFixStart:
      type: object
      additionalProperties: false
      required: [aiModel]
      description: "`aiModel` is required (`primaryName` required), the same as a start."
      properties:
        aiModel:
          $ref: "#/components/schemas/AiModel"
    CombinedStart:
      type: object
      additionalProperties: false
      required: [priorReport]
      description: One or more Review jobs, plus any Validation jobs, each with `report.md`.
      properties:
        priorReport:
          $ref: "#/components/schemas/PriorReport"
        title:
          type: string
          default: ""
        aiModel:
          $ref: "#/components/schemas/AiModel"
        notifyEmail:
          type: string
          format: email
          description: >-
            One address. When the job ends Completed or Failed, TrailCheck sends one email
            there from info@trailcheck.dev, saying how to get the report and fix file. Nothing
            is attached. Not an address is an error (400 `notifyEmail must be an email address`).
    JobInfo:
      type: object
      required: [id, status, type, title, startedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [In progress, Completed, Failed]
        type:
          type: string
          enum: [Review, Validation, Combined]
        title:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: When status is Completed or Failed.
        failureDetails:
          type: string
          description: >-
            When status is Failed. A string: what happened, then what to do next. AI-side errors say
            whose key and end with the company's request ID. A start with no report ends with
            `You weren't charged a call for this run.`
        failureCode:
          type: string
          description: When status is Failed. The reason as a code.
          enum: [reply_limit, input_limit, no_report, key_refused, no_credit, rate_limited, model_not_found, request_rejected, ai_unavailable, connection_lost, method_unavailable, server_restarted, findings_unreadable, internal_error]
        score:
          type: number
          description: When parsed. If scoreStatus is present, this is the second number in that string.
        scoreMax:
          type: number
          description: With score. What the score is out of. 100 for a Review. Lower on a Validation or Combined report when use cases or checks didn't run.
        scoreStatus:
          type: string
          description: Present when the score in the report did not match a count based on the findings. The string names both numbers. `score` is then the second number in that string. Omitted when the two numbers already matched.
        summary:
          type: string
        fixFileStatus:
          type: string
          description: >-
            Present when the report exists and there is no complete fix file. Says why, then what to do:
            `writing the fix file` while it is being written; the AI didn't hand one in; a refused line
            (`fix file was not saved: line …`); a failure (`fix file failed: …`, the same causes as a job
            failure); or `fix file is incomplete: it stops before task #<n>. The report is saved. Call
            Generate Fix File again to write the rest.` (the file says so at the top). The job's status
            does not change. Calling Generate Fix File again goes on from where an incomplete one stopped.
        fixFileCode:
          type: string
          description: With fixFileStatus. The reason as a code.
          enum: [writing, incomplete, refused, not_handed_in, reply_limit, input_limit, no_report, key_refused, no_credit, rate_limited, model_not_found, request_rejected, ai_unavailable, connection_lost, method_unavailable, server_restarted, internal_error]
        primaryName:
          type: string
          description: Model name for this job. The API key and the AI model key are not returned.
        priorReportJobIds:
          type: array
          items:
            type: string
          description: Earlier job ids this run started from. Omitted when this job did not start from one.
        useCaseRecords:
          type: array
          description: Each use case read from the report. Omitted until the report is saved, and when the use cases cannot be read from the report (see useCaseScoresNote). id is an empty string.
          items:
            type: object
            required: [id, title, goal, steps, provided, findingNumbers, score]
            properties:
              id:
                type: string
              title:
                type: string
              goal:
                type: string
              steps:
                type: string
              note:
                type: string
              provided:
                type: boolean
                description: True when this title matches a use case they named on the start, after lowercasing and collapsing spaces.
              findingNumbers:
                type: array
                items:
                  type: number
              score:
                type: number
              completionStatus:
                type: string
                enum: [Completed, Partial, Not completed]
                description: Present when the report gives one.
              outcome:
                type: string
                description: Present when the report gives one.
        useCaseScoresNote:
          type: string
          description: >-
            Present when the use cases couldn't be read from the report, so there are no useCaseRecords.
            The job is still Completed: the report, score and fix file are not affected. Always
            `The per-use-case scores couldn't be read. The use cases are in the report.`
        notifyEmail:
          type: string
          description: The address sent on the start, when one was sent. The email went there when the job ended.
    CallList:
      type: array
      items:
        oneOf:
          - $ref: "#/components/schemas/CallFetch"
          - $ref: "#/components/schemas/CallModel"
    CallFetch:
      type: object
      required: [kind, at, method, url, status, bytes, contentType]
      properties:
        kind:
          type: string
          enum: [fetch]
        at:
          type: string
          format: date-time
        method:
          type: string
        url:
          type: string
        status:
          description: Number, or null if blocked
          oneOf:
            - type: integer
            - type: "null"
        bytes:
          type: integer
        contentType:
          type: string
        error:
          type: string
    CallModel:
      type: object
      required: [kind, at, model, tokensIn, tokensOut, tools]
      properties:
        kind:
          type: string
          enum: [model]
        at:
          type: string
          format: date-time
        model:
          type: string
        tokensIn:
          type: integer
        tokensOut:
          type: integer
        tools:
          type: array
          items:
            type: string
